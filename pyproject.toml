[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pancgi"
version = "0.1.5"
authors = [{name = "Tianjie Liu"}]
maintainers = [{name = "Tianjie Liu"}]
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
description = "Pangenome analysis of CpG island sequence and presence-absence variation."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy==2.4.2",
  "pandas==3.0.1",
  "pyarrow==23.0.1",
  "biopython==1.86",
  "parasail==1.3.4",
  "pywfa==0.5.1"
]

[project.scripts]
pancgi = "pancgi_app.pancgi:main"

[project.urls]
Repository = "https://github.com/tianjie16/PanCGI"
Issues = "https://github.com/tianjie16/PanCGI/issues"

[tool.setuptools]
package-dir = {"" = "src", tools = "tools"}
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.cmdclass]
build_py = "tools.build_support.BuildPy"

[tool.setuptools.package-data]
pancgi_app = ["scripts/*.sh", "scripts/*.py", "RELEASE_MANIFEST.json"]
